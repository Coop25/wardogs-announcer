<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WARDOGS Pilot Announcements</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>WARDOGS PILOT ANNOUNCEMENTS</h1>
      <div class="header-actions">
        <button id="btnDebugToggle" class="btn btn-ghost" title="Toggle debug info">DEBUG</button>
        <button id="btnSettingsToggle" class="btn btn-ghost" title="Settings">SETTINGS</button>
      </div>
    </header>

    <div id="loadError" class="load-error" hidden></div>

    <main class="stage">
      <div class="section-label">CURRENT ANNOUNCEMENT</div>
      <div class="announcement-card">
        <div id="teamBadge" class="team-badge" hidden>TEAM: &mdash;</div>
        <p id="announcementText" class="announcement-text">Loading announcements&hellip;</p>
      </div>

      <div class="next-block">
        <div class="section-label">NEXT ANNOUNCEMENT</div>
        <div id="countdown" class="countdown">04:00</div>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>

      <div class="controls">
        <button id="btnNext" class="btn btn-primary">NEXT</button>
        <button id="btnPause" class="btn">PAUSE</button>
        <button id="btnResume" class="btn" disabled>RESUME</button>
        <button id="btnRestart" class="btn">RESTART</button>
        <button id="btnShare" class="btn" title="Copy a link to this exact announcement">SHARE</button>
      </div>

      <div id="debugInfo" class="debug-info" hidden>
        <span id="debugLine"></span>
      </div>
    </main>

    <div id="shareToast" class="share-toast" hidden>
      <div class="share-toast-row">
        <input id="shareLinkInput" class="share-link-input" type="text" readonly />
        <button id="btnCopyShareLink" class="btn btn-primary">COPY</button>
        <button id="btnCloseShareToast" class="btn btn-ghost">&times;</button>
      </div>
      <div id="shareStatus" class="share-status"></div>
    </div>

    <footer class="status-bar">
      <span id="statusGenerated">Generated this session: 0</span>
      <span id="statusHistory">Recent history: 0/30</span>
      <span id="statusLibrary">Library size: &mdash;</span>
      <span id="statusNext">Next announcement: 04:00</span>
    </footer>

    <aside id="settingsPanel" class="settings-panel" hidden>
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="btnCloseSettings" class="btn btn-ghost">CLOSE</button>
      </div>

      <div class="settings-body">
        <label class="field">
          Rotation interval (minutes)
          <input id="settingRotationMinutes" type="number" min="0.5" step="0.5" />
        </label>

        <label class="field">
          Recent history size
          <select id="settingHistorySize"></select>
        </label>

        <button id="btnResetSettings" class="btn btn-danger">Reset to Defaults</button>
      </div>
    </aside>
  </div>

  <script src="data/bundle.js"></script>
  <script src="js/lines.js"></script>
  <script src="js/history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
