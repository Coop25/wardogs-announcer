<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WARDOGS Pilot Announcements</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>WARDOGS PILOT ANNOUNCEMENTS</h1>
      <div class="header-actions">
        <button id="btnDebugToggle" class="btn btn-ghost" title="Toggle debug info">DEBUG</button>
        <button id="btnSettingsToggle" class="btn btn-ghost" title="Settings">SETTINGS</button>
      </div>
    </header>

    <div id="loadError" class="load-error" hidden></div>

    <main class="stage">
      <div class="section-label">CURRENT ANNOUNCEMENT</div>
      <div class="announcement-card">
        <p id="announcementText" class="announcement-text">Loading phrase library&hellip;</p>
      </div>

      <div class="next-block">
        <div class="section-label">NEXT ANNOUNCEMENT</div>
        <div id="countdown" class="countdown">04:00</div>
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>

      <div class="controls">
        <button id="btnNext" class="btn btn-primary">NEXT</button>
        <button id="btnPause" class="btn">PAUSE</button>
        <button id="btnResume" class="btn" disabled>RESUME</button>
        <button id="btnRestart" class="btn">RESTART</button>
      </div>

      <div id="debugInfo" class="debug-info" hidden>
        <span id="debugTemplate"></span>
        <span id="debugLength"></span>
        <span id="debugTimeAware"></span>
        <span id="debugSignature"></span>
      </div>
    </main>

    <footer class="status-bar">
      <span id="statusGenerated">Generated this session: 0</span>
      <span id="statusHistory">Recent history: 0/30</span>
      <span id="statusContext">Current context: &mdash;</span>
      <span id="statusNext">Next announcement: 04:00</span>
    </footer>

    <aside id="settingsPanel" class="settings-panel" hidden>
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="btnCloseSettings" class="btn btn-ghost">CLOSE</button>
      </div>

      <div class="settings-body">
        <label class="field">
          Rotation interval (minutes)
          <input id="settingRotationMinutes" type="number" min="0.5" step="0.5" />
        </label>

        <label class="field">
          Recent history size
          <select id="settingHistorySize"></select>
        </label>

        <fieldset class="field-group">
          <legend>Length probabilities (%)</legend>
          <label class="field-inline">Short <input id="settingLengthShort" type="number" min="0" max="100" /></label>
          <label class="field-inline">Medium <input id="settingLengthMedium" type="number" min="0" max="100" /></label>
          <label class="field-inline">Long <input id="settingLengthLong" type="number" min="0" max="100" /></label>
        </fieldset>

        <label class="field-inline">
          <input id="settingTimeAwareEnabled" type="checkbox" />
          Time-aware announcements enabled
        </label>

        <label class="field">
          Time-aware probability (%)
          <input id="settingTimeAwareProbability" type="number" min="0" max="100" />
        </label>

        <fieldset class="field-group">
          <legend>Humor styles</legend>
          <div id="settingStylesContainer" class="styles-grid"></div>
        </fieldset>

        <button id="btnResetSettings" class="btn btn-danger">Reset to Defaults</button>
      </div>
    </aside>
  </div>

  <script src="data/bundle.js"></script>
  <script src="js/timeContext.js"></script>
  <script src="js/dataLoader.js"></script>
  <script src="js/history.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
